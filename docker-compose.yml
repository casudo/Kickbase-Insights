### Kickbase Insights
###
###   cp .env.example .env    # fill in your Kickbase credentials
###   docker compose up -d
###
### The web interface and the API are both served on port 8000.
### Data is kept in an SQLite database on the `kbi-data` volume. To use PostgreSQL instead, set
### KBI_DATABASE__HOST=postgres in .env and uncomment the postgres service below.

services:
  kickbase-insights:
    container_name: kickbase_insights
    image: ghcr.io/casudo/kickbase-insights:v3.0.0
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - kbi-data:/data

  # postgres:
